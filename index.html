<style>
:root{--bg:#fff;--fg:#111;--mut:#777;--line:#e4e4e8;--card:#f4f4f7;--G:#e9eaf3;--Gt:#222;--A:#6a6fc4;--At:#fff;--N:#1c1f6b;--Nt:#fff;--hol:#d9483b;--ok:#2e9e5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000;--fg:#f2f2f2;--mut:#8a8a92;--line:#2a2a30;--card:#1c1c20;--G:#e9eaf3;--Gt:#222}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,-apple-system,sans-serif;padding:16px;max-width:480px;margin:auto}
h1{font-size:24px;margin:0 0 12px}h2{font-size:17px;margin:22px 0 8px}
.grp{margin-bottom:10px}.ysel{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}.grp .ysel{width:100%;padding:11px 0;font-size:16px;font-weight:600}.bar{display:flex;align-items:center;gap:8px;margin-top:8px;padding:10px;background:var(--card);border-radius:10px;font-size:14px}.bar span{flex:1}.bar button{padding:8px 14px;background:var(--line)}.bar button.ok{background:var(--ok);color:#fff}
button{font:inherit;color:inherit;border:0;background:var(--card);border-radius:8px;padding:9px 0;cursor:pointer}
.grp button.on{background:var(--A);color:#fff;font-weight:600}
.nav{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}.nav button{width:44px}.nav strong{font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.dow{text-align:center;color:var(--mut);font-size:12px;padding:2px 0}
.c{position:relative;border-radius:6px;min-height:50px;padding:3px 0;text-align:center;border:2px solid transparent;background:var(--card)}
.c span{display:inline-block;font-size:14px;min-width:24px;border-radius:12px}.c em{display:block;font-style:normal;font-size:10px;margin:2px 3px 0;border-radius:3px;padding:1px 0}
.c.G em{background:var(--G);color:var(--Gt)}.c.A em{background:var(--A);color:var(--At)}.c.N em{background:var(--N);color:var(--Nt)}
.c.hol{border-color:var(--hol)}.c.hol span{color:var(--hol);font-weight:700}.c.today{outline:2px solid var(--fg);outline-offset:1px}.c.today span{display:inline-block;min-width:24px;border-radius:12px;background:var(--fg);color:var(--bg);font-weight:700}
.c.w::after{content:"✓";position:absolute;right:3px;top:0;font-size:11px;color:var(--ok);font-weight:700}
.c.pad{background:none;border:0}
.sum{display:flex;gap:10px;margin:6px 0 10px}.sum div{flex:1;background:var(--card);border-radius:10px;padding:10px}.sum b{font-size:22px;display:block}.sum small{color:var(--mut)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .d{flex:1}.row .d small{display:block;color:var(--mut)}
.tag{font-size:12px;border-radius:4px;padding:2px 6px}.tag.G{background:var(--G);color:var(--Gt)}.tag.A{background:var(--A);color:#fff}.tag.N{background:var(--N);color:#fff}
.row button{padding:8px 12px;font-size:13px}.row button.on{background:var(--ok);color:#fff}
.mut{color:var(--mut);font-size:13px}.yr{margin-bottom:10px}.yr .ysel{width:100%;padding:11px 0;font-size:16px;font-weight:600}.ylist{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}.ylist button.on{background:var(--A);color:#fff}.yr button.on{font-weight:600}summary{cursor:pointer;padding:12px;background:var(--card);border-radius:10px;font-weight:600}details[open] summary{margin-bottom:6px}
.pick{margin-bottom:10px}.pick small{display:block;color:var(--mut);font-size:12px;margin:0 0 4px 4px}
.strip{position:relative;display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px calc(50% - 36px);background:var(--card);border-radius:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.strip div{flex:0 0 72px;scroll-snap-align:center;text-align:center;padding:10px 0;border-radius:8px;color:var(--mut);font-size:16px;user-select:none;-webkit-user-select:none}
.strip div.on{background:var(--A);color:#fff;font-weight:700;font-size:18px}
.sl{position:relative;height:48px;background:var(--card);border-radius:24px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;overflow:hidden;user-select:none;-webkit-user-select:none}
.sl span{font-size:14px;color:var(--mut);padding-left:44px;pointer-events:none}
.knob{position:absolute;left:4px;top:4px;width:40px;height:40px;border-radius:50%;background:var(--A);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;touch-action:none;cursor:grab}
.cls{width:100%;margin:6px 0 10px;padding:9px 0}
</style></head><body>
<h1>Vardiya ve tatil</h1>
<div class="pick" id="grp"></div>
<div class="pick" id="yr"></div>
<div class="nav"><button id="prev">‹</button><strong id="mt"></strong><button id="next">›</button></div>
<div class="cal" id="cal"></div><div id="pend"></div>
<p class="mut" id="note">Kırmızı çerçeve resmi tatil. Tatile denk gelen vardiya gününe dokununca “çalıştım” işaretlenir.</p>
<details><summary id="sm"></summary><div id="list"></div></details>
<script>
const S={A1:"GGAANNIIGGAANNIIIGAANNIIGGAANIII",A2:"GGAANNIIIGAANNIIGGAANIIIGGAANNII",A3:"IGAANNIIGGAANIIIGGAANNIIGGAANNII",A4:"GGAANIIIGGAANNIIGGAANNIIIGAANNII",
B1:"AANNIIGGAANNIIIGAANNIIGGAANIIIGG",B2:"AANNIIIGAANNIIGGAANIIIGGAANNIIGG",B3:"AANIIIGGAANNIIGGAANNIIIGAANNIIGG",B4:"AANNIIGGAANIIIGGAANNIIGGAANNIIIG",
C1:"NNIIGGAANNIIIGAANNIIGGAANIIIGGAA",C2:"NNIIGGAANIIIGGAANNIIGGAANNIIIGAA",C3:"NNIIIGAANNIIGGAANIIIGGAANNIIGGAA",C4:"NIIIGGAANNIIGGAANNIIIGAANNIIGGAA",
D1:"IIGGAANNIIGGAANNIIIGAANNIIGGAANI",D2:"IIGGAANNIIIGAANNIIGGAANIIIGGAANN",D3:"IIIGAANNIIGGAANIIIGGAANNIIGGAANN",D4:"IIGGAANIIIGGAANNIIGGAANNIIIGAANN"};
const LAB={G:"07-15",A:"15-23",N:"23-07"},AY=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const H=[["01-01","Yılbaşı"],["03-19","Ramazan Bayramı arifesi (yarım gün)"],["03-20","Ramazan Bayramı 1. gün"],["03-21","Ramazan Bayramı 2. gün"],["03-22","Ramazan Bayramı 3. gün"],["04-23","23 Nisan"],["05-01","1 Mayıs"],["05-19","19 Mayıs"],["05-26","Kurban Bayramı arifesi (yarım gün)"],["05-27","Kurban Bayramı 1. gün"],["05-28","Kurban Bayramı 2. gün"],["05-29","Kurban Bayramı 3. gün"],["05-30","Kurban Bayramı 4. gün"],["07-15","15 Temmuz"],["08-30","Zafer Bayramı"],["10-28","Cumhuriyet arifesi (yarım gün)"],["10-29","Cumhuriyet Bayramı"]];
const H26=[["01-01","Yılbaşı"],["03-19","Ramazan Bayramı arifesi (yarım gün)"],["03-20","Ramazan Bayramı 1. gün"],["03-21","Ramazan Bayramı 2. gün"],["03-22","Ramazan Bayramı 3. gün"],["04-23","23 Nisan"],["05-01","1 Mayıs"],["05-19","19 Mayıs"],["05-26","Kurban Bayramı arifesi (yarım gün)"],["05-27","Kurban Bayramı 1. gün"],["05-28","Kurban Bayramı 2. gün"],["05-29","Kurban Bayramı 3. gün"],["05-30","Kurban Bayramı 4. gün"],["07-15","15 Temmuz"],["08-30","Zafer Bayramı"],["10-28","Cumhuriyet arifesi (yarım gün)"],["10-29","Cumhuriyet Bayramı"]];
const H27=[["01-01","Yılbaşı"],["03-08","Ramazan Bayramı arifesi (yarım gün)"],["03-09","Ramazan Bayramı 1. gün"],["03-10","Ramazan Bayramı 2. gün"],["03-11","Ramazan Bayramı 3. gün"],["04-23","23 Nisan"],["05-01","1 Mayıs"],["05-15","Kurban Bayramı arifesi (yarım gün)"],["05-16","Kurban Bayramı 1. gün"],["05-17","Kurban Bayramı 2. gün"],["05-18","Kurban Bayramı 3. gün"],["05-19","Kurban Bayramı 4. gün, 19 Mayıs"],["07-15","15 Temmuz"],["08-30","Zafer Bayramı"],["10-28","Cumhuriyet arifesi (yarım gün)"],["10-29","Cumhuriyet Bayramı"]];
const FX=[["01-01","Yılbaşı"],["04-23","23 Nisan"],["05-01","1 Mayıs"],["05-19","19 Mayıs"],["07-15","15 Temmuz"],["08-30","Zafer Bayramı"],["10-28","Cumhuriyet arifesi (yarım gün)"],["10-29","Cumhuriyet Bayramı"]];
const HY={2026:H26,2027:H27,2028:FX,2029:FX,2030:FX,2031:FX,2032:FX};
const pad=n=>String(n).padStart(2,"0"),key=(m,d)=>pad(m)+"-"+pad(d);
const shift=(g,y,m,d)=>S[g][(((Math.round((Date.UTC(y,m-1,d)-Date.UTC(2026,0,1))/864e5)+21)%32)+32)%32];
const now=new Date();let yr=HY[now.getFullYear()]?now.getFullYear():2026,mo=now.getFullYear()==yr?now.getMonth():0;
let go=false,pend=null,yo=false,st={g:"D2",w:{}};
try{const x=JSON.parse(localStorage.getItem("vardiya26")||"null");if(x&&S[x.g])st=x}catch(e){}
const save=()=>{try{localStorage.setItem("vardiya26",JSON.stringify(st))}catch(e){}};
const wid=k=>(yr==2026?"":yr+"|")+st.g+"|"+k,wk=k=>st.w[wid(k)],HM=()=>Object.fromEntries(HY[yr]);
function render(){
  if(pend&&+pend.slice(0,2)!=mo+1)pend=null;
  const sl=(id,t)=>`<div class="sl" data-sl="${id}"><div class="knob">›</div><span>${t}</span></div>`,cls='<button class="cls" data-cl="1">Kapat</button>';
  document.getElementById("grp").innerHTML=go?`<div class="ylist">${Object.keys(S).map(g=>`<button class="${g==st.g?"on":""}" data-g="${g}">${g}</button>`).join("")}</div>`+cls:sl("g",`Ekip ${st.g} · değiştirmek için kaydır`);
  document.getElementById("yr").innerHTML=yo?`<div class="ylist">${Object.keys(HY).map(y=>`<button class="${y==yr?"on":""}" data-y="${y}">${y}</button>`).join("")}</div>`+cls:sl("y",`${yr} · yılı değiştirmek için kaydır`);
  document.getElementById("mt").textContent=AY[mo]+" "+yr;
  document.getElementById("prev").disabled=yr==2026&&mo==0;document.getElementById("next").disabled=yr==2032&&mo==11;
  document.getElementById("note").textContent=yr>=2028?yr+" vardiyaları 2026 döngüsünün devamıdır. Dini bayramlar henüz eklenmedi, sabit milli tatiller var.":yr==2027?"2027 vardiyaları 2026 döngüsünün devamıdır. Kurum yeni tablo verirse güncellenir.":"Kırmızı çerçeve resmi tatil. Tatile denk gelen vardiya gününe dokununca “çalıştım” işaretlenir.";
  const hm=HM(),first=(new Date(yr,mo,1).getDay()+6)%7,n=new Date(yr,mo+1,0).getDate();
  let h="PSÇPCCP".split("").map(x=>`<div class="dow">${x}</div>`).join("")+'<div class="c pad"></div>'.repeat(first);
  for(let d=1;d<=n;d++){const k=key(mo+1,d),s=shift(st.g,yr,mo+1,d);
    h+=`<div class="c ${s} ${hm[k]?"hol":""} ${wk(k)?"w":""} ${now.getFullYear()==yr&&now.getMonth()==mo&&now.getDate()==d?"today":""}" data-k="${k}"><span>${d}</span>${s!="I"?`<em>${LAB[s]}</em>`:""}</div>`}
  document.getElementById("cal").innerHTML=h;document.getElementById("pend").innerHTML=pend?`<div class="bar"><span>${+pend.slice(3)} ${AY[mo]}: ${wk(pend)?"çalıştım işaretini kaldır":"çalıştım olarak işaretle"}?</span><button class="ok" data-ok="1">Evet</button><button data-no="1">Vazgeç</button></div>`:"";
  let tot=0,w=0;
  document.getElementById("list").innerHTML=HY[yr].map(([k,name])=>{const [m,d]=k.split("-").map(Number),s=shift(st.g,yr,m,d);
    if(s!="I"){tot++;if(wk(k))w++}
    return `<div class="row"><div class="d">${d} ${AY[m-1]}<small>${name}</small></div>${s=="I"?'<span class="mut">izin</span>':`<span class="tag ${s}">${LAB[s]}</span><button class="${wk(k)?"on":""}" data-k="${k}">${wk(k)?"Çalıştım ✓":"Çalıştım?"}</button>`}</div>`}).join("");
  document.getElementById("sm").textContent=`Tatilde çalıştım: ${w} / ${tot}`;
}
function toggle(k){const [m,d]=k.split("-").map(Number);if(shift(st.g,yr,m,d)=="I"||!HM()[k])return;const id=wid(k);st.w[id]?delete st.w[id]:st.w[id]=1;save();render()}
document.addEventListener("click",e=>{if(skip){skip=false;return}const b=e.target.closest("[data-cl],[data-g],[data-y],[data-ok],[data-no],[data-k]");if(!b)return;const D=b.dataset;
  if(D.go){if(go){go=false;render()}}else if(D.g){st.g=D.g;go=false;pend=null;save();render()}else if(D.ok){const k=pend;pend=null;toggle(k)}else if(D.no){pend=null;render()}else if(D.cl){go=false;yo=false;render()}else if(D.y){yo=false;yr=+D.y;mo=now.getFullYear()==yr?now.getMonth():0;render()}else if(b.classList.contains("c")){const [m,d]=D.k.split("-").map(Number);if(HM()[D.k]&&shift(st.g,yr,m,d)!="I"){pend=D.k;render()}}else toggle(D.k)});
document.getElementById("prev").onclick=()=>{if(mo==0){yr--;mo=11}else mo--;render()};
document.getElementById("next").onclick=()=>{if(mo==11){yr++;mo=0}else mo++;render()};
let lp=null,skip=false;
document.addEventListener("pointerdown",e=>{skip=false;const b=e.target.closest("[data-go],[data-yo]");if(!b)return;clearTimeout(lp);lp=setTimeout(()=>{lp=null;skip=true;if(b.dataset.go){go=!go;yo=false}else{yo=!yo;go=false}render();if(navigator.vibrate)navigator.vibrate(30)},600)});
["pointerup","pointercancel"].forEach(t=>document.addEventListener(t,()=>{clearTimeout(lp);lp=null}));
document.addEventListener("contextmenu",e=>{if(e.target.closest(".ysel"))e.preventDefault()});
let drag=null;
document.addEventListener("pointerdown",e=>{const k=e.target.closest(".knob");if(!k)return;const tr=k.parentElement;drag={k,tr,x0:e.clientX,dx:0,max:tr.clientWidth-k.offsetWidth-8,id:tr.dataset.sl};k.setPointerCapture(e.pointerId)});
document.addEventListener("pointermove",e=>{if(!drag)return;drag.dx=Math.max(0,Math.min(drag.max,e.clientX-drag.x0));drag.k.style.transform=`translateX(${drag.dx}px)`});
const endDrag=()=>{if(!drag)return;const d=drag;drag=null;if(d.dx>=d.max*0.85){if(d.id=="g"){go=true;yo=false}else{yo=true;go=false}render()}else{d.k.style.transition="transform .2s";d.k.style.transform="";setTimeout(()=>d.k.style.transition="",200)}};
["pointerup","pointercancel"].forEach(t=>document.addEventListener(t,endDrag));
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

render();
</script></body></html>
